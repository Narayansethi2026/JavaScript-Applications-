<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO-DO LIST</title>
    <!-- Font Awesome (icons ke liye zaroori) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Apni CSS file yahan link karo (ya inline <style> daal do) -->
    <link rel="stylesheet" href="style.css">
    <style>
        
    </style>
</head>

<body>
    <div class="container">
        <h1><i class="fas fa-list-check"></i> todo tracker</h1>

        <!-- STATS -->
        <div class="stats">
            <div class="stat">
                <div class="num" id="stattotal">0</div>
                <div class="lbl">total</div>
            </div>
            <div class="stat pending">
                <div class="num" id="statpending">0</div>
                <div class="lbl">pending</div>
            </div>
            <div class="stat done">
                <div class="num" id="statdone">0</div>
                <div class="lbl">completed</div>
            </div>
        </div>

        <!-- FORM -->
        <form class="todo-form" id="todoform" onsubmit="return false;">
            <div class="field">
                <label>title</label>
                <input id="todotitle" type="text" placeholder="title work to-do" autocomplete="off" maxlength="60">
            </div>
            <div class="field">
                <label>task</label>
                <input id="todotask" type="text" placeholder="write your task..." autocomplete="off" maxlength="199">
            </div>
            <button class="add-btn" id="add-btn" type="button" title="add task">
                <i class="fas fa-plus"></i>
            </button>
            <div class="error-msg" id="errormsg"></div>
        </form>

        <!-- FILTER TABS -->
        <div class="filter-tabs" id="filtertabs">
            <button data-filter="all" class="active">ALL</button>
            <button data-filter="pending">pending</button>
            <button data-filter="completed">completed</button>
        </div>

        <!-- LIST -->
        <ul class="todo-list" id="todolist"></ul>
    </div>

    <script>
        /* ---------- STATE ---------- */
        let todos = [];
        let activeFilter = "all";

        /* ---------- ELEMENTS ---------- */
        const form       = document.getElementById("todoform");
        const todotitle  = document.getElementById("todotitle");
        const todotask   = document.getElementById("todotask");
        const addbtn     = document.getElementById("add-btn");
        const errormsg   = document.getElementById("errormsg");
        const todolist   = document.getElementById("todolist");
        const filtertabs = document.getElementById("filtertabs");
        const stattotal  = document.getElementById("stattotal");
        const statpending= document.getElementById("statpending");
        const statdone   = document.getElementById("statdone");

        /* ---------- ADD TODO ---------- */
        function addtodo() {
            errormsg.textContent = '';
            const title = todotitle.value.trim();
            const task  = todotask.value.trim();   // ← FIX: task se lo, title se nahi

            if (!title) {
                errormsg.textContent = 'please enter title';
                todotitle.focus();
                return;
            }
            if (!task) {
                errormsg.textContent = 'please enter your task';
                todotask.focus();
                return;
            }

            todos.unshift({
                id: Date.now() + Math.random(),
                title,
                task,
                completed: false,                              // ← FIX spelling
                date: new Date().toLocaleDateString('en-IN', { // ← FIX spelling
                    day: '2-digit', month: 'short', year: 'numeric'
                })
            });

            todotitle.value = '';
            todotask.value  = '';
            todotitle.focus();
            render();
        }

        /* ---------- TOGGLE COMPLETE ---------- */
        function toggleComplete(id) {
            const t = todos.find(x => x.id === id);
            if (t) t.completed = !t.completed;
            render();
        }

        /* ---------- DELETE ---------- */
        function deleteTodo(id) {
            todos = todos.filter(x => x.id !== id);
            render();
        }

        /* ---------- RENDER ---------- */
        function render() {
            const total   = todos.length;
            const done    = todos.filter(t => t.completed).length;
            const pending = total - done;

            stattotal.textContent   = total;
            statpending.textContent = pending;
            statdone.textContent    = done;

            const filtered = activeFilter === 'all'
                ? todos
                : activeFilter === 'pending'
                    ? todos.filter(t => !t.completed)
                    : todos.filter(t => t.completed);

            todolist.innerHTML = '';

            if (filtered.length === 0) {
                const msg = activeFilter === 'all'
                    ? 'No tasks yet — add one above!'
                    : activeFilter === 'pending'
                        ? 'No pending tasks — good job!'
                        : 'No completed tasks yet.';
                todolist.innerHTML = `
                    <li class="empty-state">
                        <i class="fas fa-clipboard-list"></i>
                        ${msg}
                    </li>`;
                return;
            }

            filtered.forEach(t => {
                const li = document.createElement('li');
                li.className = 'todo-item' + (t.completed ? ' completed' : '');
                li.innerHTML = `
                    <button class="check-btn" data-id="${t.id}" title="${t.completed ? 'Mark as Pending' : 'Mark as Complete'}">
                        <i class="fas ${t.completed ? 'fa-check' : 'fa-circle'}"></i>
                    </button>
                    <div class="todo-body">
                        <div class="t-title">${escapeHtml(t.title)}</div>
                        <div class="t-task">${escapeHtml(t.task)}</div>
                        <div class="t-date"><i class="fas fa-clock"></i> ${t.date} · ${t.completed ? 'COMPLETED' : 'PENDING'}</div>
                    </div>
                    <button class="del-btn" data-id="${t.id}" title="Delete">
                        <i class="fas fa-trash"></i>
                    </button>
                `;
                todolist.appendChild(li);
            });

            todolist.querySelectorAll('.check-btn').forEach(btn => {
                btn.addEventListener('click', () => toggleComplete(parseFloat(btn.dataset.id)));
            });
            todolist.querySelectorAll('.del-btn').forEach(btn => {
                btn.addEventListener('click', () => deleteTodo(parseFloat(btn.dataset.id)));
            });
        }

        /* ---------- XSS SAFE ---------- */
        function escapeHtml(str) {
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        /* ---------- FILTER TABS ---------- */
        filtertabs.addEventListener('click', (e) => {   // ← FIX: filtertabs
            const btn = e.target.closest('button');
            if (!btn) return;
            activeFilter = btn.dataset.filter;
            filtertabs.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render();
        });

        /* ---------- EVENTS ---------- */
        addbtn.addEventListener('click', addtodo);      // ← FIX: addbtn + addtodo
        form.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                addtodo();
            }
        });

        /* ---------- INIT ---------- */
        render();
    </script>
</body>
</html>
