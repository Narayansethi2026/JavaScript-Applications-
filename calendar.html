<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Calendar</title>
  <style>
    /* Color Palette Variables */
    :root {
      --bg-dark: #030407;
      --accent-teal: #155869;
      --accent-lime: #d4ff24;
      --text-light: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .calendar-card {
      background-color: rgba(21, 88, 105, 0.15);
      border: 1px solid var(--accent-teal);
      border-radius: 16px;
      width: 100%;
      max-width: 380px;
      padding: 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .calendar-header h2 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--accent-lime);
      letter-spacing: 0.5px;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid var(--accent-teal);
      color: var(--text-light);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      background-color: var(--accent-teal);
      color: var(--accent-lime);
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-light);
      transition: all 0.2s ease;
    }

    .day:hover:not(.empty) {
      background-color: var(--accent-teal);
    }

    .day.today {
      background-color: var(--accent-lime);
      color: var(--bg-dark);
      font-weight: 700;
      box-shadow: 0 0 12px rgba(212, 255, 36, 0.4);
    }

    .day.empty {
      cursor: default;
    }
  </style>
</head>
<body>

  <div class="calendar-card">
    <div class="calendar-header">
      <button class="nav-btn" id="prevBtn">&lt;</button>
      <h2 id="monthYear"></h2>
      <button class="nav-btn" id="nextBtn">&gt;</button>
    </div>

    <div class="weekdays">
      <div>Su</div>
      <div>Mo</div>
      <div>Tu</div>
      <div>We</div>
      <div>Th</div>
      <div>Fr</div>
      <div>Sa</div>
    </div>

    <div class="days" id="daysContainer"></div>
  </div>

  <script>
    const monthYearText = document.getElementById('monthYear');
    const daysContainer = document.getElementById('daysContainer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    let currentDate = new Date();

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      // Header display update
      const monthNames = [
        "January", "February", "March", "April", "May", "June",
        "July", "August", "September", "October", "November", "December"
      ];
      monthYearText.innerText = `${monthNames[month]} ${year}`;

      daysContainer.innerHTML = "";

      // Month ke pehle din ka index (0 = Sunday, 1 = Monday...)
      const firstDayIndex = new Date(year, month, 1).getDay();
      
      // Current month me kitne din hain
      const lastDate = new Date(year, month + 1, 0).getDate();

      // Empty spaces for previous month's remaining days
      for (let i = 0; i < firstDayIndex; i++) {
        const emptyDiv = document.createElement('div');
        emptyDiv.classList.add('day', 'empty');
        daysContainer.appendChild(emptyDiv);
      }

      // Dates render karna
      const today = new Date();
      for (let date = 1; date <= lastDate; date++) {
        const dayDiv = document.createElement('div');
        dayDiv.classList.add('day');
        dayDiv.innerText = date;

        // Today date highlight check
        if (
          date === today.getDate() &&
          month === today.getMonth() &&
          year === today.getFullYear()
        ) {
          dayDiv.classList.add('today');
        }

        daysContainer.appendChild(dayDiv);
      }
    }

    // Controls for navigation
    prevBtn.addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });

    nextBtn.addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });

    renderCalendar();
  </script>

</body>
</html>
