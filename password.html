<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RANDOM PASSWORD GENERATOR</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #030407;
            padding: 20px;
        }

        .generator-card {
            background: #0b0e14;
            border: 1px solid #1558c9;
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 0 30px rgba(21, 88, 201, 0.35);
        }

        .generator-card h2 {
            text-align: center;
            margin-bottom: 22px;
            color: #d4ff24;
            text-transform: capitalize;
            letter-spacing: 1px;
            text-shadow: 0 0 12px rgba(212, 255, 36, 0.5);
        }

        .display-box {
            display: flex;
            gap: 8px;
            margin-bottom: 22px;
        }

        .display-box input {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #1558c9;
            border-radius: 8px;
            outline: none;
            letter-spacing: 1px;
            background: #030407;
            color: #d4ff24;
            font-weight: 600;
        }

        .display-box input::placeholder { color: #4b5563; }
        .display-box input:focus { border-color: #d4ff24; box-shadow: 0 0 10px rgba(212,255,36,0.4); }

        .copy-btn {
            padding: 12px 18px;
            background: #1558c9;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            text-transform: capitalize;
            transition: 0.2s;
        }

        .copy-btn:hover { background: #d4ff24; color: #030407; }

        .controls { margin-bottom: 20px; }

        .range-container label {
            display: block;
            margin-bottom: 10px;
            color: #d4ff24;
            font-weight: 600;
        }

        .range-container input[type="range"] {
            width: 100%;
            accent-color: #1558c9;
            cursor: pointer;
        }

        .checkboxes {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .checkboxes label {
            color: #cbd5e1;
            cursor: pointer;
            font-size: 15px;
            transition: 0.2s;
        }

        .checkboxes label:hover { color: #d4ff24; }

        .checkboxes input {
            accent-color: #1558c9;
            margin-right: 8px;
            transform: scale(1.15);
            cursor: pointer;
        }

        .generate-btn {
            width: 100%;
            padding: 14px;
            background: #1558c9;
            color: #ffffff;
            border: 2px solid #1558c9;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-transform: capitalize;
            letter-spacing: 0.5px;
            transition: 0.25s;
        }

        .generate-btn:hover {
            background: #d4ff24;
            color: #030407;
            border-color: #d4ff24;
            box-shadow: 0 0 20px rgba(212,255,36,0.6);
        }

        #msg {
            text-align: center;
            margin-top: 14px;
            color: #d4ff24;
            font-weight: 600;
            min-height: 20px;
        }

        .back-home {
            margin-top: 25px;
            display: flex;
            justify-content: center;
        }

        .back-home a {
            text-decoration: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            font-weight: 500;
            padding: 10px 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            transition: 0.25s ease;
            background: rgba(255, 255, 255, 0.03);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-home a:hover {
            color: #d4ff24;
            border-color: #d4ff24;
            background: rgba(212, 255, 36, 0.05);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 255, 36, 0.1);
        }
    </style>
</head>

<body>
    <div class="generator-card">
        <h2>password generator</h2>

        <div class="display-box">
            <input type="text" id="password" placeholder="click generator">
            <button class="copy-btn" onclick="copyPassword()">copy</button>
        </div>

        <div class="controls">
            <div class="range-container">
                <label>password length: <span id="lengthVal">12</span></label>
                <input type="range" id="length" min="6" max="15" value="12" oninput="updateLength()">
            </div>
            <div class="checkboxes">
                <label><input type="checkbox" id="uppercase" checked> Include Uppercase (A-Z)</label>
                <label><input type="checkbox" id="lowercase" checked> Include Lowercase (a-z)</label>
                <label><input type="checkbox" id="numbers" checked> Include Numbers (0-9)</label>
                <label><input type="checkbox" id="symbols" checked> Include Symbols (!@#$)</label>
            </div>
        </div>
        
        <button class="generate-btn" onclick="generatorPassword()">generate password</button>
        <p id="msg"></p>
    </div>

    <div class="back-home">
        <a href="index.html">&larr; Back to Home</a>
    </div>

    <script>
        function updateLength() {
            let length = document.getElementById("length").value;
            document.getElementById("lengthVal").innerText = length;
        }

        function generatorPassword() {
            let length = document.getElementById("length").value;
            let upper = document.getElementById("uppercase").checked;
            let lower = document.getElementById("lowercase").checked;
            let nums = document.getElementById("numbers").checked;
            let syms = document.getElementById("symbols");
            let msg = document.getElementById("msg");

            let chars = "";
            if (upper) chars += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            if (lower) chars += "abcdefghijklmnopqrstuvwxyz";
            if (nums) chars += "0123456789";
            if (syms && syms.checked) chars += "!@#$%^&*()_+~`|}{[]:;?><,./-=";

            if (chars === "") {
                msg.style.color = "#dc2626";
                msg.innerText = "Kam se kam ek option select karein!";
                return;
            }

            let password = "";
            for (let i = 0; i < length; i++) {
                let randomIndex = Math.floor(Math.random() * chars.length);
                password += chars[randomIndex];
            }

            document.getElementById("password").value = password;
            msg.innerText = "";
        }

        function copyPassword() {
            let passwordBox = document.getElementById("password");
            let msg = document.getElementById("msg");

            if (passwordBox.value === "") {
                msg.style.color = "#dc2626";
                msg.innerText = "Pehle password generate karein!";
                return;
            }

            navigator.clipboard.writeText(passwordBox.value);

            msg.style.color = "#16a34a";
            msg.innerText = "Password copied to clipboard!";
        }
    </script>
</body>

</html>
