<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN PAGE WITH JS</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #030407;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(21, 88, 140, 0.35), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(212, 255, 36, 0.10), transparent 45%);
    color: #ffffff;
  }

  .robotics-card {
    width: 380px;
    padding: 45px 35px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(21, 88, 140, 0.4);
    border-radius: 20px;
    backdrop-filter: blur(14px);
    box-shadow:
      0 20px 50px rgba(0, 0, 0, 0.6),
      0 0 0 1px rgba(255, 255, 255, 0.03) inset;
    text-align: center;
  }

  .system-tag {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #d4ff24;
    background: rgba(212, 255, 36, 0.08);
    padding: 6px 14px;
    border-radius: 30px;
    margin-bottom: 22px;
    font-weight: 600;
  }

  h2 {
    color: #ffffff;
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 30px;
    letter-spacing: 0.5px;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin-bottom: 20px;
  }

  .input-group input {
    padding: 14px 16px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    color: #ffffff;
    font-size: 14px;
    outline: none;
    transition: all 0.25s ease;
  }

  .input-group input::placeholder {
    color: rgba(255, 255, 255, 0.4);
  }

  .input-group input:focus {
    border-color: #15588c;
    background: rgba(21, 88, 140, 0.15);
    box-shadow: 0 0 0 3px rgba(21, 88, 140, 0.25);
  }

  #result {
    min-height: 18px;
    font-size: 13px;
    margin-bottom: 14px;
    letter-spacing: 0.3px;
  }

  .cyber-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #15588c, #1e7bc4);
    border: none;
    border-radius: 10px;
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .cyber-btn:hover {
    background: linear-gradient(135deg, #1e7bc4, #15588c);
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(21, 88, 140, 0.5);
  }

  .cyber-btn:active {
    transform: translateY(0);
  }
    </style>
</head>

<body>
    <div class="robotics-card">
        <div class="system-tag">system is sctive</div>
        <h2>welcome to my website</h2>

        <div class="input-group">
            <input type="text" id="username" placeholder="username">
            <input type="password" id="password" placeholder="password">
        </div>
        <p id="result"></p>
        <button class="cyber-btn" onclick="login()">LOGIN</button>
    </div>
    <script>
        function login() {

            let CORRECT_USERNAME = "ADMIN"
            let CORRECT_PASSWORD = "12345"


            let username = document.getElementById("username").value;
            let password = document.getElementById("password").value;
            let result = document.getElementById("result");


            if (username === "" || password === "") {
                result.style.color = "red";
                result.innerHTML = "please fill both side";
                return;

            }

            if (username === CORRECT_USERNAME && password === CORRECT_PASSWORD) {
                result.style.color = "green";
                result.innerHTML = " login successful"

                setTimeout(() => {
                    window.location.href = "home.html";
                }, 1500);
            } else {
                result.style.color = "red";
                result.innerHTML = "invalid username or password";
            }


        }

    </script>
</body>

</html>
