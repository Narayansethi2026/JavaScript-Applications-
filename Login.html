<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN PAGE WITH JS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        /* 2. Body Styling: Screen ke bilkul center mein box ko lane ke liye Flexbox */
        body {
            background: linear-gradient(135deg, #1e1e2f, #2a2a40); /* Soft Dark Gradient Background */
            height: 100vh;                                        /* Full Screen Height */
            display: flex;                                         /* Flexbox ON */
            justify-content: center;                               /* Horizontally Center */
            align-items: center;                                  /* Vertically Center */
        }

        /* 3. Main Container Box: Professional Login Card */
        .login-card {
            background-color: #ffffff;             /* Box ka background white */
            padding: 40px 30px;                    /* andar se jagah (Top/Bottom 40px, Left/Right 30px) */
            width: 360px;                          /* Box ki fixed width */
            border-radius: 12px;                   /* Box ke corners gol (curved) karne ke liye */
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3); /* Premium Shadow effect */
            text-align: center;                    /* Sub text center mein rahega */
        }

        /* 4. Heading (Title) */
        .login-card h2 {
            color: #333333;
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        /* Subtitle line */
        .login-card p.subtitle {
            color: #777777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* 5. Input Groups: Inputs ko achhi spacing dene ke liye container */
        .input-group {
            margin-bottom: 18px;
            text-align: left; /* Input labels ya placeholer align karne ke liye */
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: #555555;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;                           /* Full width input field */
            padding: 12px 14px;                    /* Andar ki jagah */
            border: 1px solid #cccccc;             /* Soft Grey Border */
            border-radius: 8px;                    /* Curved borders for input */
            font-size: 14px;
            outline: none;                         /* Default blue glow hatane ke liye */
            transition: border-color 0.3s;
        }

        /* Input click hone par glow hone waala effect */
        .input-group input:focus {
            border-color: #4f46e5;                 /* Modern Indigo Color */
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        /* 6. Professional Button */
        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #4f46e5;             /* Primary Blue/Violet theme */
            color: #ffffff;                        /* Text color white */
            border: none;                          /* Border remove */
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;                      /* Cursor change on hover */
            margin-top: 10px;
            transition: background 0.3s, transform 0.1s;
        }

        /* Button Hover and Click effect */
        .login-btn:hover {
            background-color: #4338ca;            /* Darker Shade on Hover */
        }

        .login-btn:active {
            transform: scale(0.98);                /* Click feel effect */
        }

        /* 7. JavaScript Result Message */
        #result {
            margin-top: 15px;
            font-size: 14px;
            font-weight: 600;
        }

    </style>
</head>

<body>
    <div class="login-card">
        <h2>welcome to my website</h2>

        <div class="input-group">
            <input type="text" id="username" placeholder="username">
            <input type="password" id="password" placeholder="password">
        </div>
        <p id="result"></p>
        <button class="login-btn" onclick="login()">LOGIN</button>
    </div>
    <script>
        function login() {

            let CORRECT_USERNAME = "ADMIN"
            let CORRECT_PASSWORD = "12345"


            let username = document.getElementById("username").value;
            let password = document.getElementById("password").value;
            let result = document.getElementById("result");


            if (username === "" || password === "") {
                result.style.color = "red";
                result.innerHTML = "please fill both side";
                return;

            }

            if (username === CORRECT_USERNAME && password === CORRECT_PASSWORD) {
                result.style.color = "green";
                result.innerHTML = " login sucseeful"

                setTimeout(() => {
                    window.location.href = "home.html";
                }, 1500);
            } else {
                result.style.color = "red";
                result.innerHTML = "invalid username or password";
            }


        }

    </script>
</body>

</html>
