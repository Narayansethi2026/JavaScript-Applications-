<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN PAGE WITH JS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background: #080c14; /* Deep Tech Dark */
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 242, 254, 0.1) 0%, transparent 70%),
                linear-gradient(rgba(0, 242, 254, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 254, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px; /* Tech Grid Effect */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 2. Main Robotics Interface HUD Box */
        .robotics-card {
            background: rgba(10, 25, 47, 0.75);
            border: 2px solid #00f2fe;
            padding: 35px 30px;
            width: 380px;
            border-radius: 4px;
            /* Cut Corner Tech Look */
            clip-path: polygon(
                0 15px, 15px 0, 
                calc(100% - 15px) 0, 100% 15px, 
                100% calc(100% - 15px), calc(100% - 15px) 100%, 
                15px 100%, 0 calc(100% - 15px)
            );
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.3), inset 0 0 15px rgba(0, 242, 254, 0.15);
            text-align: center;
            position: relative;
        }

        /* Sci-Fi Header Tag */
        .system-tag {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            color: #00f2fe;
            letter-spacing: 2px;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        /* Main Heading */
        .robotics-card h2 {
            font-family: 'Orbitron', sans-serif;
            color: #ffffff;
            font-size: 20px;
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px #00f2fe;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(0, 242, 254, 0.3);
            padding-bottom: 10px;
        }

        /* 3. Input Groups */
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: #00f2fe;
            margin-bottom: 6px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 15, 30, 0.8);
            border: 1px solid #00f2fe;
            color: #ffffff;
            font-size: 16px;
            letter-spacing: 1px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input::placeholder {
            color: rgba(0, 242, 254, 0.4);
        }

        /* Input Glow on Focus */
        .input-group input:focus {
            box-shadow: 0 0 12px #00f2fe;
            background: rgba(0, 30, 60, 0.9);
        }

        /* 4. Futuristic Authorize Button */
        .cyber-btn {
            width: 100%;
            padding: 14px;
            background: transparent;
            color: #00f2fe;
            border: 2px solid #00f2fe;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 2px;
            cursor: pointer;
            margin-top: 10px;
            position: relative;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
        }

        .cyber-btn:hover {
            background: #00f2fe;
            color: #080c14;
            box-shadow: 0 0 20px #00f2fe;
        }

        .cyber-btn:active {
            transform: scale(0.97);
        }

        /* 5. Validation Result Display */
        #result {
            margin-top: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            letter-spacing: 1px;
            min-height: 20px;
        }
       
    </style>
</head>

<body>
    <div class="robotics-card">
        <div class="system-tag">system is sctive</div>
        <h2>welcome to my website</h2>

        <div class="input-group">
            <input type="text" id="username" placeholder="username">
            <input type="password" id="password" placeholder="password">
        </div>
        <p id="result"></p>
        <button class="cyber-btn" onclick="login()">LOGIN</button>
    </div>
    <script>
        function login() {

            let CORRECT_USERNAME = "ADMIN"
            let CORRECT_PASSWORD = "12345"


            let username = document.getElementById("username").value;
            let password = document.getElementById("password").value;
            let result = document.getElementById("result");


            if (username === "" || password === "") {
                result.style.color = "red";
                result.innerHTML = "please fill both side";
                return;

            }

            if (username === CORRECT_USERNAME && password === CORRECT_PASSWORD) {
                result.style.color = "green";
                result.innerHTML = " login sucseeful"

                setTimeout(() => {
                    window.location.href = "home.html";
                }, 1500);
            } else {
                result.style.color = "red";
                result.innerHTML = "invalid username or password";
            }


        }

    </script>
</body>

</html>
