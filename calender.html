<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="chrono-card">
    <div class="header">
      <div class="brand">
        <h2>CALENDER// <span>EVENT</span></h2>
      </div>
      <div class="nav-group">
        <button class="btn-cyber" id="prevBtn">&lt;</button>
        <span id="monthYear" style="font-weight: 700; letter-spacing: 1px; min-width: 140px; text-align: center;"></span>
        <button class="btn-cyber" id="nextBtn">&gt;</button>
      </div>
    </div>

    <div class="weekdays">
      <div>Sun</div>
      <div>Mon</div>
      <div>Tue</div>
      <div>Wed</div>
      <div>Thu</div>
      <div>Fri</div>
      <div>Sat</div>
    </div>

    <div class="days-grid" id="daysGrid"></div>
  </div>

  <div class="modal" id="eventModal">
    <div class="modal-content">
      <h3 id="modalTitle">LOG // EVENT</h3>
      <input type="text" id="eventInput" placeholder="Enter task or log..." />
      <div class="modal-actions">
        <button class="btn-cancel" id="closeModal">Cancel</button>
        <button class="btn-delete" id="deleteEventBtn" style="display: none;">Delete</button>
        <button class="btn-save" id="saveEventBtn">Save</button>
      </div>
    </div>
  </div>
</body>
</html>
