<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALENDER</title>
    <style>
        * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
      border-radius: 0 !important;
    }

    body {
      background: #080808;
      color: #00ff66;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .grid-container {
      width: 100%;
      max-width: 820px;
      border: 2px solid #00ff66;
      background: #0d0d0d;
      padding: 20px;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.15);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #00ff66;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .status {
      background: #00ff66;
      color: #000;
      font-weight: bold;
      padding: 2px 6px;
      font-size: 0.75rem;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid #00ff66;
      color: #00ff66;
      padding: 4px 12px;
      cursor: pointer;
      font-weight: bold;
    }

    .nav-btn:hover {
      background: #00ff66;
      color: #000;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: bold;
      border-bottom: 1px solid #1a1a1a;
      padding-bottom: 8px;
      margin-bottom: 8px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      background: #1a1a1a;
      border: 1px solid #1a1a1a;
    }

    .cell {
      min-height: 80px;
      background: #0d0d0d;
      padding: 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .cell:hover {
      background: #00ff66;
      color: #000;
    }

    .cell:hover .date-num {
      color: #000;
    }

    .cell.empty {
      background: #050505;
      cursor: default;
    }

    .cell.today {
      border: 1px solid #00ff66;
      background: #0f2415;
    }

    .date-num {
      font-weight: bold;
      font-size: 0.85rem;
      color: #00ff66;
    }

    .event {
      background: #00ff66;
      color: #000;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 2px 4px;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cell:hover .event {
      background: #000;
      color: #00ff66;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: #0d0d0d;
      border: 2px solid #00ff66;
      padding: 20px;
      width: 300px;
    }

    .modal-box h4 {
      margin-bottom: 12px;
      font-size: 0.9rem;
    }

    .modal-box input {
      width: 100%;
      background: #000;
      border: 1px solid #00ff66;
      color: #00ff66;
      padding: 8px;
      margin-bottom: 12px;
      outline: none;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn {
      background: transparent;
      border: 1px solid #00ff66;
      color: #00ff66;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .btn:hover {
      background: #00ff66;
      color: #000;
    }

    .btn-del {
      border-color: #ff3333;
      color: #ff3333;
    }

    .btn-del:hover {
      background: #ff3333;
      color: #000;
    }
        
    </style>
</head>
<body>
   <div class="grid-container">
    <div class="top-bar">
      <div>
        <span class="status">GRID_SYS // ACTIVE</span>
      </div>
      <div>
        <button class="nav-btn" id="prev">&lt;</button>
        <span id="monthDisplay" style="margin: 0 10px; font-weight: bold;"></span>
        <button class="nav-btn" id="next">&gt;</button>
      </div>
    </div>

    <div class="weekdays">
      <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
    </div>

    <div class="calendar-grid" id="grid"></div>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal-box">
      <h4 id="modalTitle">ENTRY_LOG</h4>
      <input type="text" id="eventInput" placeholder="Task description..." />
      <div class="modal-actions">
        <button class="btn" id="closeBtn">CANCEL</button>
        <button class="btn btn-del" id="delBtn" style="display:none;">DELETE</button>
        <button class="btn" id="saveBtn">SAVE</button>
      </div>
    </div>
  </div>
</body>
</html>
