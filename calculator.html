<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CALCULATOR</title>
</head>

<body>
  <div class="calculator">
    <input type="text" placeholder="0">
    <div>
      <button>AC</button>
      <button>DEL</button>
      <button>%</button>
      <button>/</button>

    </div>
  </div>
    <div>
      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button>+</button>

    </div>
  </div>
    <div>
      <button>5</button>
      <button>6</button>
      <button>7</button>
      <button>-</button>

    </div>
  </div>
    <div>
      <button>8</button>
      <button>9</button>
      <button>0</button>
      <button>%</button>

    </div>
  </div>
  <script>
    let input = document.getElementById('inputBox');
    let button = document.querySelectorAll('button');

    let string = "";
    let arr = Array.from(button);
    arr.forEach(button => {
        button.addEventListener("click",(e) =>{
            if(e.target.innerHTML == '='){
              string = eval(string);
              input.value = string;

            }
            string += e.target.innerHTML;
            input.value = string;

        })
    })
  </script>
</body>

</html>
