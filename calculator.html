<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CALCULATOR</title>
  <style>
    *{
      box-sizing: border-box;
      font-family: 'segoe ui',
    }
    body{
      background-color: #030407;
      color:#f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .calculator {
      background: #0d121b;
      padding: 24px;
      border-radius: 16px;
      border: 1px solid #155869;
      box-shadow: 0 10px 30px rgba(21, 88, 105, 0.3);
      width: 300px;
    }

    .calculator input {
      width: 100%;
      height: 65px;
      background-color: #030407;
      border: 2px solid #155869;
      border-radius: 8px;
      color: #d4ff24;
      font-size: 28px;
      text-align: right;
      padding: 0 15px;
      margin-bottom: 20px;
      outline: none;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5);
    }

    .calculator div {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      justify-content: center;
    }

    button {
      flex: 1;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background-color: #155869;
      color: #ffffff;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
    }

    button:hover {
      background-color: #1b6d82;
      box-shadow: 0 0 12px rgba(212, 255, 36, 0.3);
    }

    button:active {
      transform: scale(0.95);
    }

    
    button:last-child {
      background-color: #d4ff24;
      color: #030407;
    }

    button:last-child:hover {
      background-color: #e2ff54;
      box-shadow: 0 0 15px #d4ff24;
    }
  </style>
</head>

<body>
  <div class="calculator">
    <input type="text" id="inputBox" placeholder="0">
    <div>
      <button>AC</button>
      <button>DEL</button>
      <button>%</button>
      <button>/</button>
    </div>
    <div>
      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button>+</button>
    </div>
    <div>
      <button>5</button>
      <button>6</button>
      <button>7</button>
      <button>-</button>
    </div>
    <div>
      <button>8</button>
      <button>9</button>
      <button>0</button>
      <button>=</button>
    </div>
  </div>

  <script>
    let input = document.getElementById('inputBox');
    let buttons = document.querySelectorAll('button');

    let string = "";
    let arr = Array.from(buttons);
    
    arr.forEach(button => {
      button.addEventListener("click", (e) => {
        let btnValue = e.target.innerHTML;

        if (btnValue == '=') {
          try {
            string = eval(string);
            input.value = string;
          } catch (error) {
            input.value = "error";
            string = "";
          }
        }
        else if (btnValue == 'AC') {
          string = "";
          input.value = string;
        }
        else if (btnValue == 'DEL') {
          string = string.substring(0, string.length - 1);
          input.value = string;
        }
        else {
          string += btnValue;
          input.value = string;
        }
      });
    });
  </script>
</body>

</html>
